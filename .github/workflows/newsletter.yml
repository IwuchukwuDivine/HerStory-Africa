name: Newsletter reminder

# Reminder only. Editions go out on the 1st and the 15th, and are written in a
# session three days before (see docs/newsletter/voice-guide.md). This job
# never drafts, builds or sends anything: it checks each morning whether an
# edition is due in three days and, if so, says whether it is written yet.
#
# Sending happens only from /admin/newsletter ("Approve and schedule").

on:
  schedule:
    - cron: "0 7 * * *" # every day, 08:00 in Lagos
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for an edition due in three days
        id: due
        run: |
          DUE=$(date -u -d "+3 days" +%Y-%m-%d)
          DAY=$(date -u -d "+3 days" +%d)
          if [ "$DAY" != "01" ] && [ "$DAY" != "15" ]; then
            echo "Nothing due on $DUE."
            echo "due=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A shipping edition is a non-sample file whose date matches.
          FILE=$(grep -l "^date: *[\"']\?$DUE" app/content/newsletter/[!_]*.md 2>/dev/null | head -n 1 || true)
          if [ -n "$FILE" ]; then
            SLUG=$(basename "$FILE" .md)
            MESSAGE="The edition for $DUE is written ($SLUG). Build it, test it in /admin/newsletter, then approve and schedule."
          else
            MESSAGE="An edition is due on $DUE and none is written yet. Time to pick the story and write the brief."
          fi
          echo "$MESSAGE"
          echo "due=$DUE" >> "$GITHUB_OUTPUT"
          echo "message=$MESSAGE" >> "$GITHUB_OUTPUT"

      - name: Notify
        if: steps.due.outputs.due != ''
        env:
          MESSAGE: ${{ steps.due.outputs.message }}
        run: |
          curl -s \
            -H "Title: Newsletter due ${{ steps.due.outputs.due }}" \
            -H "Tags: envelope" \
            -H "Click: https://herstoryafrica.com.ng/admin/newsletter" \
            -d "$MESSAGE" \
            ntfy.sh/herstory-africa-newsletter
